[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgait"
version = "0.1.0"
description = "FlowgaitNet for gait recognition from radar range-Doppler sequences"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "einops>=0.6",
    "numpy>=1.23",
    "Pillow>=9.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.64",
]

[project.optional-dependencies]
experiments = ["pandas>=2.0"]
development = [
    "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["train_flowgaitnet", "train_flowgaitnet_action_subset"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "training*", "model_img*"]

[tool.ruff]
target-version = "py39"
line-length = 100
